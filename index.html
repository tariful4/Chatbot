<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Self-Learning AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 600px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .chat-box { height: 400px; border: 1px solid #ddd; border-radius: 5px; overflow-y: scroll; padding: 10px; margin-bottom: 15px; background: #fafafa; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 6px; max-width: 80%; line-height: 1.4; word-break: break-word; }
        .user { background: #0084ff; color: #fff; align-self: flex-end; }
        .bot { background: #e4e6eb; color: #000; align-self: flex-start; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background: #0084ff; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #006dd3; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Advanced AI Chatbot</h2>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-group">
        <input type="text" id="userInput" placeholder="এখানে কিছু লিখুন..." onkeypress="handleKeyPress(event)">
        <button id="sendBtn">পাঠান</button>
    </div>
</div>

<!-- Firebase SDKs & Chat Logic -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCOwXc5gc46tz1UjPEqcA993YS62clgV_k",
        authDomain: "tchat-46fdb.firebaseapp.com",
        projectId: "tchat-46fdb",
        storageBucket: "tchat-46fdb.firebasestorage.app",
        messagingSenderId: "223368702559",
        appId: "1:223368702559:web:65b9a708ffb81a861909ea"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const GEMINI_API_KEY = "AQ.Ab8RN6JljJWVKZOZRxomfd89_SkO1am1rNnfaw6nYA1cUWbUJg"; // আপনার জেমিনি এপিআই কি এখানে দিন

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        userInput.value = "";
        
        let botReply = "";

        try {
            // ১. ফায়ারবেস থেকে আগের মেমরি লোড করা
            const querySnapshot = await getDocs(collection(db, "knowledge_base"));
            let memoryContext = "";
            let foundLocally = false;

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if (data.userInput && data.userInput.toLowerCase().includes(text.toLowerCase())) {
                    botReply = data.botResponse;
                    foundLocally = true;
                }
                memoryContext += `User: ${data.userInput} | Bot: ${data.botResponse}\n`;
            });

            // ২. লোকাল মেমরিতে না পেলে জেমিনি এপিআই কল করা
            if (!foundLocally) {
                botReply = await fetchSmartAnswerFromGemini(text, memoryContext);

                // ৩. ফায়ারবেসে নতুন তথ্য সেভ করা
                await addDoc(collection(db, "knowledge_base"), {
                    userInput: text,
                    botResponse: botReply,
                    timestamp: new Date()
                });
            }
        } catch (e) {
            console.error("ত্রুটি ঘটেছে: ", e);
            botReply = "দুঃখিত, এই মুহূর্তে সার্ভারে সংযোগ করতে সমস্যা হচ্ছে।";
        }

        setTimeout(() => {
            appendMessage(botReply, 'bot');
        }, 500);
    }

    async function fetchSmartAnswerFromGemini(userMessage, pastMemory) {
        if (GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
            return "অনুগ্রহ করে কোডে আপনার সঠিক Gemini API Key যুক্ত করুন।";
        }

        try {
            const systemPrompt = `তুমি একজন অত্যন্ত বুদ্ধিমান এবং সেলফ-লার্নিং এআই চ্যাটবট। ইউজার ঘুরিয়ে বা ইশারা-ইঙ্গিতে কিছু বললে তার অন্তর্নিহিত উদ্দেশ্য বুঝে নিখুঁত উত্তর দেবে। আগের কথোপকথনের মেমরি: \n${pastMemory}`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [
                        { parts: [{ text: systemPrompt }, { text: userMessage }] }
                    ]
                })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content) {
                return data.candidates[0].content.parts[0].text;
            } else {
                return "বিষয়টি বুঝতে পারিনি, দয়া করে একটু পরিষ্কার করে বলুন।";
            }
        } catch (err) {
            return "অনলাইন থেকে তথ্য আনতে সমস্যা হয়েছে।";
        }
    }

    function appendMessage(text, sender) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    window.handleKeyPress = function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    // বাটনে ইভেন্ট লিসেনার যুক্ত করা হলো যাতে অপশন হারিয়ে না যায়
    sendBtn.addEventListener("click", sendMessage);
</script>

</body>
</html>
